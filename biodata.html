
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biografi Tugas 3</title>

    <style>
        /* Pengaturan halaman */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: white;
        }

        /* ID untuk header */
        #header {
            background-color: #19b99c;
            color: black;
            text-align: center;
            padding: 25px 10px;
            border-radius: 20px 20px 0 0;
        }

        #header h1 {
            margin: 0;
            font-size: 36px;
        }

        /* Class untuk navigasi */
        .navigasi {
            background-color: #fffafd;
            text-align: center;
            padding: 18px;
            border-radius: 0 0 30px 30px;
        }

        .navigasi a {
            color: #62518b;
            text-decoration: none;
            font-weight: bold;
            margin: 0 18px;
        }

        .navigasi a:hover {
            text-decoration: underline;
        }

        /* Bagian biodata */
        #konten {
            background-color: #842b2b;
            padding: 30px;
        }

        #konten h2 {
            font-size: 32px;
            margin-top: 5px;
            margin-bottom: 30px;
        }

        .data-biodata {
            font-size: 23px;
            line-height: 1.6;
        }

        .data-biodata p {
            margin-bottom: 28px;
            overflow-wrap: anywhere;
        }

        /* Footer */
        #footer {
            background-color: #d0ef12;
            color: black;
            text-align: center;
            padding: 15px;
            border-radius: 0 0 20px 20px;
        }

        #footer h2 {
            font-size: 26px;
        }

        /* Tampilan untuk HP */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            #header h1 {
                font-size: 28px;
            }

            #konten {
                padding: 22px;
            }

            #konten h2 {
                font-size: 27px;
            }

            .data-biodata {
                font-size: 19px;
            }

            .navigasi a {
                margin: 0 10px;
            }
        }
    </style>
</head>

<body>

    <!-- Bagian Header -->
    <header id="header">
        <h1>Biografi Tugas 3</h1>
    </header>

    <!-- Menu Navigasi -->
    <nav class="navigasi">
        <a href="index.html">Home</a>
        <a href="biodata.html">Biodata</a>
    </nav>

    <!-- Bagian Biodata -->
    <main id="konten">
        <h2>Biodata Diri</h2>

        <div class="data-biodata">
            <p>Nama Lengkap: [Nama lengkap kamu]</p>

            <p>Nama Panggilan: [Nama panggilan kamu]</p>

            <p>Tempat, Tanggal Lahir: [Tempat, tanggal lahir]</p>

            <p>Umur: [Umur kamu]</p>

            <p>Pendidikan: Mahasiswa Teknik Informatika Semester 4</p>

            <p>Hobi: [Hobi kamu]</p>
        </div>
    </main>

    <!-- Bagian Footer -->
    <footer id="footer">
        <h2>Terima Kasih</h2>
    </footer>

</body>
</html>

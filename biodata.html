
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Biodata</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #852b2b;
        }

        /* Menggunakan ID */
        #header {
            background-color: #19b99c;
            text-align: center;
            padding: 25px;
        }

        #header h1 {
            font-size: 36px;
            margin: 10px 0 20px;
        }

        /* Menggunakan Class */
        .navigasi a {
            color: black;
            text-decoration: none;
            font-weight: bold;
            margin: 0 12px;
        }

        .navigasi a:hover {
            text-decoration: underline;
        }

        #konten {
            padding: 35px 15px;
            min-height: 500px;
        }

        .kartu-form {
            background-color: white;
            max-width: 600px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        .kartu-form h2 {
            text-align: center;
            color: #147c6c;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        .jenis-kelamin label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }

        .jenis-kelamin input {
            width: auto;
        }

        .tombol {
            padding: 11px 22px;
            border: none;
            border-radius: 5px;
            color: white;
            background-color: #19a88d;
            cursor: pointer;
        }

        .tombol-reset {
            background-color: #777;
        }

        #pesan {
            color: #147c6c;
            font-weight: bold;
        }

        #footer {
            background-color: #d0ef12;
            text-align: center;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            #header h1 {
                font-size: 28px;
            }

            .kartu-form {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <header id="header">
        <h1>Formulir Biodata</h1>

        <nav class="navigasi">
            <a href="index.html">Home</a>
            <a href="biodata.html">Biodata</a>
        </nav>
    </header>

    <main id="konten">
        <section class="kartu-form">
            <h2>Formulir Data Diri</h2>
            <p>Silakan isi biodata dengan lengkap.</p>

            <form id="formBiodata">

                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama"
                        placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="form-group">
                    <label for="nim">NIM</label>
                    <input type="text" id="nim" name="nim"
                        placeholder="Masukkan NIM" required>
                </div>

                <div class="form-group">
                    <label for="tanggal">Tanggal Lahir</label>
                    <input type="date" id="tanggal" name="tanggal"
                        required>
                </div>

                <div class="form-group">
                    <label>Jenis Kelamin</label>
                    <div class="jenis-kelamin">
                        <label>
                            <input type="radio" name="jk"
                                value="Laki-laki" required>
                            Laki-laki
                        </label>

                        <label>
                            <input type="radio" name="jk"
                                value="Perempuan">
                            Perempuan
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat</label>
                    <textarea id="alamat" name="alamat"
                        rows="3" placeholder="Masukkan alamat"
                        required></textarea>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                        placeholder="Masukkan email" required>
                </div>

                <div class="form-group">
                    <label for="prodi">Program Studi</label>
                    <select id="prodi" name="prodi" required>
                        <option value="">Pilih program studi</option>
                        <option value="Teknik Informatika">
                            Teknik Informatika
                        </option>
                        <option value="Sistem Informasi">
                            Sistem Informasi
                        </option>
                        <option value="Manajemen">Manajemen</option>
                        <option value="Akuntansi">Akuntansi</option>
                    </select>
                </div>

                <button type="submit" class="tombol"
                    id="tombolSimpan">Simpan</button>

                <button type="reset"
                    class="tombol tombol-reset">Reset</button>

                <p id="pesan"></p>
            </form>
        </section>
    </main>

    <footer id="footer">
        Footer
    </footer>

    <script>
        document.getElementById("formBiodata")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                document.getElementById("pesan").textContent =
                    "Formulir berhasil diisi!";
            });

        document.getElementById("formBiodata")
            .addEventListener("reset", function() {
                document.getElementById("pesan").textContent = "";
            });
    </script>

</body>
</html>

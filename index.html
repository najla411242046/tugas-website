
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Header */
        header {
            background-color: #19b69e;
            color: white;
            text-align: center;
            padding: 12px;
        }

        header h1 {
            font-size: 28px;
        }

        /* Navigasi */
        nav {
            background-color: #842b2b;
            text-align: center;
            padding: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 22px;
            font-size: 13px;
            font-weight: bold;
        }

        /* Konten */
        main {
            background-color: #842b2b;
            color: white;
            height: 325px;
            padding: 60px 25px;
            font-size: 12px;
        }

        /* Footer */
        footer {
            background-color: #d5f000;
            color: black;
            text-align: center;
            padding: 26px;
            font-size: 23px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <header>
        <h1>Website saya</h1>
    </header>

    <nav>
        <a href="./index.html">Home</a>
        <a href="./biodata.html">Biodata</a>
    </nav>

    <main>
        <p>
            Pengenalan HTML dan CSS merupakan dasar dalam pembuatan website.
            HTML digunakan untuk membuat struktur halaman web, sedangkan CSS
            digunakan untuk mengatur tampilan, warna, ukuran teks, dan tata letak
            agar website terlihat lebih menarik dan mudah dibaca.
        </p>
    </main>

    <footer>
        Footer
    </footer>

</body>
</html>
